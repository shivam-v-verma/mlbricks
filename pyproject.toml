[project]
name = "mlbricks"
version = "0.1.0"
description = "Core ML tooling, including config resolution, registry, and storage."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Shivam Verma", email = "shivam.vvm.verma@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.56",
    "pydantic>=2.13.4",
    "torch>=2.12.0",
]

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "moto[s3]>=5.2.2",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
    "ty>=0.0.42",
]

[tool.ruff]
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "C90",
    "RUF",
    "PLC0415",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ty.environment]
python-version = "3.13"
